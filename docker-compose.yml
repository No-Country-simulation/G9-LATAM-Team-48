# EnergyAI — stack para NAS / Docker
# Uso: docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: energyai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energia_ia}
      POSTGRES_USER: ${POSTGRES_USER:-energia_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - energyai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energia_app} -d ${POSTGRES_DB:-energia_ia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: energyai-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energyai-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      PREDICTION_API_BASE_URL: ${PREDICTION_API_BASE_URL:-http://ml:8000}
      APP_PERSISTENCE_TYPE: jpa
      FLYWAY_ENABLED: "true"
      JPA_DDL: validate
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-energia_ia}
      DB_USERNAME: ${POSTGRES_USER:-energia_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DB_DRIVER: org.postgresql.Driver
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_USE_MOCK_AUTH: "false"
        VITE_USE_MOCK_API: "false"
        VITE_ML_API_URL: ""
    container_name: energyai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  energyai_pgdata:
