recommendation.high.consumption=Seu consumo de energia é alto. Recomendamos evitar o uso de aparelhos de alto consumo durante o horário de pico (18h às 22h) e considerar a transição para a tecnologia inverter.
recommendation.medium.consumption=Você mantém um consumo moderado. Você pode otimizá-lo ainda mais definindo o ar condicionado para 24°C constantes e desconectando dispositivos em modo stand-by (consumo vampiro).
recommendation.low.consumption=Excelente trabalho! Seu consumo é baixo e eficiente. Sugerimos manter esses hábitos e explorar o uso de sensores de movimento em áreas comuns para automatizar a iluminação.
recommendation.default=Nenhum perfil de consumo claro foi detectado. Recomendamos priorizar a iluminação LED e eletrodomésticos com certificação de eficiência energética Classe A.
