# ============================================================================
# Perfil PROD - produccion
# ----------------------------------------------------------------------------
# Todos los valores sensibles se resuelven EXCLUSIVAMENTE desde variables de
# entorno (sin defaults inseguros). Se activa con SPRING_PROFILES_ACTIVE=prod.
# ============================================================================

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.alura: INFO

# En produccion la interfaz de Swagger UI permanece deshabilitada por seguridad.
springdoc:
  swagger-ui:
    enabled: false

security:
  jwt:
    # Obligatorio en produccion: la aplicacion no debe arrancar sin un secreto real.
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

prediction:
  api:
    base-url: ${PREDICTION_API_BASE_URL}

# Persistencia MySQL obligatoria en produccion
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # SMTP: setear MAIL_* (o SPRING_MAIL_*) en Railway. Sin esto el registro deja emailStatus=PENDING.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  persistence:
    type: jpa
  frontend-base-url: ${FRONTEND_BASE_URL:https://g9-latam-team-48.vercel.app}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
