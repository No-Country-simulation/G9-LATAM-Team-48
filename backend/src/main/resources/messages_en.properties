recommendation.high.consumption=Your energy consumption is high. We recommend avoiding high-consumption appliances during peak hours (6:00 PM to 10:00 PM) and considering a transition to inverter technology.
recommendation.medium.consumption=You maintain a moderate consumption. You could optimize it further by setting your air conditioning to a constant 75°F (24°C) and unplugging standby devices (phantom load).
recommendation.low.consumption=Excellent work! Your consumption is low and efficient. We suggest maintaining these habits and exploring the use of motion sensors in common areas to automate lighting.
recommendation.default=No clear consumption profile was detected. We recommend prioritizing LED lighting and appliances with Class A energy efficiency certification.
