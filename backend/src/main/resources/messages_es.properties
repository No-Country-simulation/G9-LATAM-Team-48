recommendation.high.consumption=Tu consumo energético es elevado. Te recomendamos evitar el uso de electrodomésticos de alto consumo durante las horas pico (18:00 a 22:00) y considerar la transición a tecnología inverter.
recommendation.medium.consumption=Mantienes un consumo moderado. Podrías optimizarlo un poco más configurando el aire acondicionado a 24°C de manera constante y desconectando los dispositivos en modo stand-by (consumo vampiro).
recommendation.low.consumption=¡Excelente trabajo! Tu consumo es bajo y eficiente. Te sugerimos mantener estos hábitos y explorar el uso de sensores de presencia en áreas comunes para automatizar la iluminación.
recommendation.default=No se detectó un perfil de consumo claro. Te recomendamos priorizar el uso de iluminación LED y electrodomésticos con certificación de eficiencia energética Clase A.
