# ============================================================================
# Perfil TEST - configuración para pruebas automatizadas
# ============================================================================
# Se activa con @ActiveProfiles("test")
# Usa InMemoryUserRepository y base de datos H2 en memoria

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25
    username: test
    password: test

# Usar InMemoryUserRepository para tests; mail desactivado
app:
  persistence:
    type: in-memory
  mail:
    enabled: false
  email-verification:
    expose-token: true
  password-reset:
    expose-token: true

# Logging para tests
logging:
  level:
    root: INFO
    com.alura: DEBUG
