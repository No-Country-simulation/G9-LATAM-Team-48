# ============================================================================
# Perfil DEV - desarrollo local
# ----------------------------------------------------------------------------
# Valores comodos para desarrollo. Se activa con SPRING_PROFILES_ACTIVE=dev
# (valor por defecto del proyecto).
# ============================================================================

server:
  port: 8080

logging:
  level:
    root: INFO
    com.alura: DEBUG

# Swagger UI habilitado en desarrollo.
springdoc:
  swagger-ui:
    enabled: true

prediction:
  api:
    base-url: http://localhost:8000

# Configuración de persistencia MySQL
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# Usar adaptador JPA para persistencia
app:
  persistence:
    type: jpa
