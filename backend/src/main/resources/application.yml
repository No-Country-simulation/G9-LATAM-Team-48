# ============================================================================
# Configuracion base (comun a todos los perfiles) - Energy Backend
# ----------------------------------------------------------------------------
# Los valores sensibles NO deben escribirse aqui en claro. Se resuelven mediante
# variables de entorno con valores por defecto para desarrollo local: ${VAR:default}.
# ============================================================================

spring:
  application:
    name: energy-backend

  # Perfil activo. Sobrescribible con la variable de entorno SPRING_PROFILES_ACTIVE.
  # Perfiles disponibles: dev, prod.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  # Puerto de la aplicacion. Ajustable por entorno.
  # PaaS (Render, etc.) inyectan PORT; local y Docker suelen usar SERVER_PORT o 8080.
  port: ${SERVER_PORT:${PORT:8080}}

# ----------------------------------------------------------------------------
# Configuracion de seguridad / JWT
# ----------------------------------------------------------------------------
# El JWT Secret se inyectara desde una variable de entorno (NUNCA versionar el
# secreto real). El valor por defecto es solo para arranque en desarrollo.
security:
  jwt:
    # TODO (JWT Secret): reemplazar por un secreto robusto via variable de entorno JWT_SECRET.
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret}
    # Tiempo de expiracion del token en milisegundos (24h por defecto).
    expiration: ${JWT_EXPIRATION:86400000}

# ----------------------------------------------------------------------------
# Integracion con el servicio de Machine Learning (FastAPI)
# ----------------------------------------------------------------------------
prediction:
  api:
    # Microservicio ML (ml-service / FastAPI). Ver docs/backend/ANALISIS_IA.md
    base-url: ${PREDICTION_API_BASE_URL:http://localhost:8000}
    timeout: ${PREDICTION_API_TIMEOUT:5000}

# ----------------------------------------------------------------------------
# Documentacion OpenAPI / Swagger UI
# ----------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ----------------------------------------------------------------------------
# Actuator (observabilidad para CI/CD y health checks de contenedores)
# ----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ----------------------------------------------------------------------------
# Umbrales heurísticos (SHAP / métricas derivadas) — tunables por Data Science
# Override: APP_CALCULATION_* en .env / OCI (ver backend/.env.example)
# ----------------------------------------------------------------------------
app:
  calculation:
    default-occupants-count: ${APP_CALCULATION_DEFAULT_OCCUPANTS_COUNT:2}
    default-consumption-per-person: ${APP_CALCULATION_DEFAULT_CONSUMPTION_PER_PERSON:150.0}
    default-area-m2: ${APP_CALCULATION_DEFAULT_AREA_M2:60.0}
    min-area-threshold: ${APP_CALCULATION_MIN_AREA_THRESHOLD:10.0}
    poor-insulation-ratio-threshold: ${APP_CALCULATION_POOR_INSULATION_RATIO_THRESHOLD:0.5}
    fair-insulation-ratio-threshold: ${APP_CALCULATION_FAIR_INSULATION_RATIO_THRESHOLD:0.2}
    # Alineado a SHAP v3 (Bueno=0.7, Regular=1.0, Malo=1.3) — reports DS
    insulation-factor-poor: ${APP_CALCULATION_INSULATION_FACTOR_POOR:1.3}
    insulation-factor-fair: ${APP_CALCULATION_INSULATION_FACTOR_FAIR:1.0}
    insulation-factor-good: ${APP_CALCULATION_INSULATION_FACTOR_GOOD:0.7}
    default-equipment-count: ${APP_CALCULATION_DEFAULT_EQUIPMENT_COUNT:5}
    high-equipment-threshold: ${APP_CALCULATION_HIGH_EQUIPMENT_THRESHOLD:10}
    medium-equipment-threshold: ${APP_CALCULATION_MEDIUM_EQUIPMENT_THRESHOLD:5}
    led-proportion-low: ${APP_CALCULATION_LED_PROPORTION_LOW:0.25}
    led-proportion-medium: ${APP_CALCULATION_LED_PROPORTION_MEDIUM:0.45}
    led-proportion-high: ${APP_CALCULATION_LED_PROPORTION_HIGH:0.75}
